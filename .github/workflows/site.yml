name: Tests and site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XKB libraries and data
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 libxkbregistry0 xkb-data python3 shellcheck
      # The illustrations test compares against the runner's base layout, which
      # may differ from the xkeyboard-config version the SVGs were generated with.
      - name: Run tests
        run: SKIP_TESTS=illustrations tests/run.sh
      - name: Build site
        run: tools/build_site.sh _site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
